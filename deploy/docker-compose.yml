services:
  maa-fnos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAA_TARBALL: maa-linux.tar.gz
    image: maa-fnos:local
    container_name: maa-fnos
    restart: "no"
    ports:
      - "18000:8000"
    environment:
      MAA_ADAPTER: official
      MAA_CORE_DIR: /opt/maa
      MAA_WEB_HOST: 0.0.0.0
      MAA_WEB_PORT: "8000"
      TZ: Asia/Shanghai
    volumes:
      # 持久化运行数据（任务配置/日志），容器删了数据还在
      - maa-data:/app/data
    # adb 需要访问 USB/网络设备时放开
    # privileged: true

volumes:
  maa-data:
